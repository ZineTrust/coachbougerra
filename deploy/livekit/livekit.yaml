# LiveKit server settings (the API key and secret come from the environment, see docker-compose.yml).
port: 7880            # the signalling port, only reached through Caddy (wss)
rtc:
  tcp_port: 7881      # fallback for networks that block UDP (open it in the firewall)
  port_range_start: 50000
  port_range_end: 60000
  use_external_ip: true
turn:
  enabled: true       # helps phones on mobile networks that block direct connections
  udp_port: 3478
room:
  empty_timeout: 600
  max_participants: 0
logging:
  level: info
