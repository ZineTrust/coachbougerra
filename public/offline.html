<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#08101d" />
    <title>Hors ligne · Coach Bougerra</title>
    <style>
      html, body { height: 100%; margin: 0; }
      body {
        display: grid; place-items: center; padding: 24px;
        background: radial-gradient(60% 50% at 85% 10%, rgb(18 163 127 / .28), transparent 70%), #08101d;
        color: #fff; font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
        text-align: center;
      }
      .card { max-width: 26rem; }
      .logo {
        width: 72px; height: 72px; margin: 0 auto 24px; border-radius: 20px;
        background: linear-gradient(135deg, #2fc196, #0a6a54);
        display: grid; place-items: center; font-weight: 800; font-size: 28px; letter-spacing: -1px;
      }
      h1 { font-size: 1.6rem; margin: 0 0 8px; }
      p { margin: 0 0 8px; color: #b4bfce; line-height: 1.6; }
      button {
        margin-top: 20px; padding: 12px 28px; border: 0; border-radius: 999px;
        background: #0c8467; color: #fff; font-weight: 700; font-size: 1rem; cursor: pointer;
      }
      .ar { direction: rtl; margin-top: 24px; padding-top: 24px; border-top: 1px solid rgb(255 255 255 / .12); }
    </style>
  </head>
  <body>
    <div class="card">
      <div class="logo">CB</div>
      <h1>Vous êtes hors ligne</h1>
      <p>Vérifiez votre connexion internet puis réessayez.</p>
      <div class="ar">
        <h1>لا يوجد اتصال بالإنترنت</h1>
        <p>تحقق من اتصالك ثم أعد المحاولة.</p>
      </div>
      <button onclick="location.reload()">Réessayer · إعادة المحاولة</button>
    </div>
  </body>
</html>
