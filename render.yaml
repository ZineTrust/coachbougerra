# Render Blueprint: describes the website. Its database is a Supabase Postgres (see README, "Database on Supabase"),
# whose address is set by hand in the dashboard as DATABASE_URL.
# Dashboard -> New -> Blueprint -> pick this repository. Render then asks for the
# values marked "sync: false" below (they are secrets, so they are NOT written here).
#
# "free" plans are for testing: the website falls asleep after ~15 minutes without
# visitors (the next visit takes about a minute to wake it). Switch the website (and the Supabase
# project) to a paid plan before the real launch (Dashboard -> the service -> Settings -> Instance Type).

services:
  - type: web
    name: coach-bougerra
    runtime: node
    region: frankfurt
    plan: free
    # devDependencies are needed to build (Tailwind, TypeScript)
    buildCommand: npm install --include=dev && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: "22"
      # The Postgres address: the Supabase "Session pooler" string (it holds the password, so it is set in the
      # dashboard, never here). Render only has IPv4: do not use Supabase's "Direct connection" address.
      - key: DATABASE_URL
        sync: false
      # The owner account is created from these the very first time the site starts.
      - key: OWNER_NAME
        value: Coach Bouguerra
      - key: OWNER_EMAIL
        sync: false
      - key: OWNER_PASSWORD
        sync: false
      # Phone notifications (keep the same pair for ever, see .env.example).
      # NEXT_PUBLIC_* is baked in when the site is built.
      - key: VAPID_SUBJECT
        sync: false
      - key: NEXT_PUBLIC_VAPID_PUBLIC_KEY
        sync: false
      - key: VAPID_PRIVATE_KEY
        sync: false
      # Where videos sent from a phone are kept: an S3-compatible bucket (Backblaze B2, see README
      # "Videos on Backblaze B2"). Without these, the upload button is off and only links work.
      - key: STORAGE_ENDPOINT
        sync: false
      - key: STORAGE_BUCKET
        sync: false
      - key: STORAGE_KEY_ID
        sync: false
      - key: STORAGE_KEY_SECRET
        sync: false
      # The members' AI assistant (free Groq key from console.groq.com, see README "Assistant IA").
      # Without it the assistant page says it is not active yet. Optional extras, add them in the
      # dashboard only when needed: ASSISTANT_DAILY_LIMIT (default 5), ASSISTANT_MODELS, ASSISTANT_API_URL.
      - key: GROQ_API_KEY
        sync: false
      # The live room: a LiveKit server carries the video (LiveKit Cloud free plan, or your own, see README
      # "Live room"). Without these three the lives can be planned but the room is not open yet.
      # Optional extra: LIVEKIT_MAX_PARTICIPANTS (a limit per room).
      - key: LIVEKIT_URL
        sync: false
      - key: LIVEKIT_API_KEY
        sync: false
      - key: LIVEKIT_API_SECRET
        sync: false
